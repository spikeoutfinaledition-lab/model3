name: Build Switch NRO

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Switch dependencies
        run: |
          dkp-pacman -Syu --noconfirm switch-zlib switch-bzip2 switch-pkg-config switch-gl4es switch-sdl2

      - name: Build
        run: |
          export DEVKITPRO=/opt/devkitpro
          export DEVKITA64=$DEVKITPRO/devkitA64
          export PORTLIBS=$DEVKITPRO/portlibs/switch
          
          export CFLAGS="-Wno-error -Wno-discarded-qualifiers -Wno-unused-variable -Wno-unused-parameter"
          
          export PKG_CONFIG=$PORTLIBS/bin/aarch64-none-elf-pkg-config
          
          make LIBS+="-lGL" -j$(nproc)
