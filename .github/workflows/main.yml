name: Build Switch NRO

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install zlib manually
        run: |
          wget https://github.com/devkitPro/pacman-packages/releases/download/switch-zlib-1.2.13-1/switch-zlib-1.2.13-1-any.pkg.tar.zst -O /tmp/zlib.pkg.tar.zst
          mkdir -p /opt/devkitpro/portlibs/switch
          tar --use-compress-program=unzstd -xvf /tmp/zlib.pkg.tar.zst -C /opt/devkitpro/portlibs/switch --strip-components=1
          ls /opt/devkitpro/portlibs/switch/include/zlib.h

      - name: Build
        run: |
          export
