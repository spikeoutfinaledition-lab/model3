name: Build Supermodel Model3 Switch NRO

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install devkitPro official script
        run: |
          wget https://apt.devkitpro.org/install-devkitpro-pacman
          chmod +x ./install-devkitpro-pacman
          sudo ./install-devkitpro-pacman

      - name: Install Switch packages
        run: |
          sudo dkp-pacman -S --noconfirm devkitA64 switch-sdl2 switch-freetype switch-libpng switch-zlib

      - name: Set env
        run: |
          echo "DEVKITPRO=/opt/devkitpro" >> $GITHUB_ENV
          echo "DEVKITA64=/opt/devkitpro/devkitA64" >> $GITHUB_ENV
          echo "PATH=/opt/devkitpro/devkitA64/bin:/opt/devkitpro/tools/bin:$PATH" >> $GITHUB_ENV

      - name: Build
        run: |
          make -j$(nproc)

      - name: Upload NRO artifact
        uses: actions/upload-artifact@v4
        with:
          name: supermodel-model3-nro
          path: |
            Switch/*.nro
            *.nro
