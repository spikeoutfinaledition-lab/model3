name: Build Switch NRO

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build
        run: |
          export DEVKITPRO=/opt/devkitpro
          export DEVKITA64=$DEVKITPRO/devkitA64
          export PORTLIBS=$DEVKITPRO/portlibs/switch
          
          export CFLAGS="-O2 -D__SWITCH__ -DGLEW_NO_GLU -Wno-error -Wno-unused-variable -Wno-unused-parameter -I$PORTLIBS/include -isystem$DEVKITPRO/libnx/include"
          export CXXFLAGS="$CFLAGS"
          export CPPFLAGS="-D__SWITCH__ -DGLEW_NO_GLU -I$PORTLIBS/include -isystem$DEVKITPRO/libnx/include"
          export LDFLAGS="-L$PORTLIBS/lib -L$DEVKITPRO/libnx/lib -lz"
          
          make -j$(nproc)
