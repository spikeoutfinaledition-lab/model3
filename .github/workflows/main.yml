name: Build Switch NRO

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Fix Git permissions
        run: git config --global --add safe.directory /github/workspace

      - name: Install devkitPro keyring
        run: |
          wget https://github.com/devkitPro/pacman/releases/download/devkitpro-keyring-1.0.1/devkitpro-keyring-1.0.1-1-any.pkg.tar.xz
          sudo pacman -U --noconfirm devkitpro-keyring-1.0.1-1-any.pkg.tar.xz

      - name: Install dependencies
        run: |
          sudo dkp-pacman -Sy --noconfirm
          sudo dkp-pacman -S --noconfirm --needed switch-dev switch-mesa switch-zlib switch-bzip2 switch-freetype switch-libpng switch-libjpeg-turbo

      - name: Debug environment
        run: |
          echo "Checking for stdio.h..."
          find /opt/devkitpro -name "stdio.h" 2>/dev/null
          echo "Checking for zlib.h..."
          find /opt/devkitpro -name "zlib.h" 2>/dev/null
          echo "Listing devkitA64 directory..."
          ls -R /opt/devkitpro/devkitA64/

      - name: Build with Make
        run: make
