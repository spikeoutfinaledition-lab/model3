name: Build Switch NRO

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Switch dependencies
        run: |
          for i in {1..5}; do
            dkp-pacman -Sy --noconfirm switch-zlib switch-bzip2 switch-pkg-config switch-gl4es switch-sdl2 && break
            echo "Attempt $i failed with 403. Retrying in 15 seconds..."
            sleep 15
          done

      - name: Build
        run: |
          export DEVKITPRO=/opt/devkitpro
          export DEVKITA64=$DEVKITPRO/devkitA64
          export PORTLIBS=$DEVKITPRO/portlibs/switch
          
          # 压制警告防止编译中断
          export CFLAGS="-Wno-error -Wno-discarded-qualifiers -Wno-unused-variable -Wno-unused-parameter"
          
          export PKG_CONFIG=$PORTLIBS/bin/aarch64-none-elf-pkg-config
          
          make -j$(nproc)
