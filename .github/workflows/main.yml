name: Build Switch NRO

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install DevKitPro toolchain
        run: |
          wget -qO- https://apt.devkitpro.org/install-devkitpro-pacman | sudo bash
          sudo dkp-pacman -Sy
          sudo dkp-pacman -S --noconfirm devkitA64 libnx switch-tools libpng switch-libpng zlib switch-zlib

      - name: Build with Make
        run: |
          export DEVKITPRO=/opt/devkitpro
          export DEVKITA64=/opt/devkitpro/devkitA64
          make -j$(nproc)

      - name: Upload NRO
        uses: actions/upload-artifact@v4
        with:
          name: switch-nro
          path: "*.nro"
