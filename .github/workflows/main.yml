name: Build with Wonderful Toolchain

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Wonderful Toolchain
        run: |
          sudo mkdir -p /opt/wonderful
          sudo chown -R $USER:$USER /opt/wonderful
          wget https://wonderful.asie.pl/downloads/wonderful-toolchain-linux-x86_64.tar.gz
          tar -xf wonderful-toolchain-linux-x86_64.tar.gz -C /opt/wonderful
          echo "/opt/wonderful/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: |
          wf-pacman -Syu --noconfirm
          wf-pacman -S --noconfirm toolchain-gcc-arm-none-eabi zlib

      - name: Build
        run: |
          export BLOCKSDS=/opt/blocksds/core
          make -j$(nproc)
