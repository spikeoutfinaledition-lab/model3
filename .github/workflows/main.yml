name: Build Supermodel Model3 Switch NRO

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup devkitPro
        uses: ilove2sleep/setup-devkitpro@v1
        with:
          target: a64
          packages: devkitA64,switch-sdl2,switch-freetype,switch-libpng,switch-zlib

      - name: Build
        run: |
          make -j$(nproc)

      - name: Upload NRO artifact
        uses: actions/upload-artifact@v4
        with:
          name: supermodel-model3-nro
          path: |
            Switch/*.nro
            *.nro
