name: Build Supermodel Model3 Switch NRO

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitpro:latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Switch依赖库
        run: |
          dkp-pacman -S --noconfirm devkitA64 switch-sdl2 switch-freetype switch-libpng switch-zlib

      - name: 编译
        run: |
          make -j$(nproc)

      - name: 上传NRO
        uses: actions/upload-artifact@v4
        with:
          name: supermodel-model3-nro
          path: |
            Switch/*.nro
            *.nro
