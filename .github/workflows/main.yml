name: Build Switch NRO

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install DevKitPro toolchain
        run: |
          # 安装基础依赖
          sudo apt-get update
          sudo apt-get install -y wget ca-certificates gnupg
          
          # 配置 DevKitPro 国内镜像源（清华源）
          sudo tee /etc/apt/sources.list.d/devkitpro.list <<EOF
          deb https://mirrors.tuna.tsinghua.edu.cn/devkitpro/debian generic main
          EOF
          
          # 导入 GPG 密钥
          wget -qO - https://devkitpro.org/keyring.gpg | sudo gpg --dearmor -o /usr/share/keyrings/devkitpro-archive-keyring.gpg
          
          # 更新并安装工具链
          sudo apt-get update
          sudo apt-get install -y devkitpro-pacman
          
          # 验证安装
          which dkp-pacman
          
          # 安装 Switch 开发套件
          sudo dkp-pacman -Syu --noconfirm
          sudo dkp-pacman -S --noconfirm switch-dev

      - name: Build with Make
        run: |
          export DEVKITPRO=/opt/devkitpro
          export DEVKITA64=/opt/devkitpro/devkitA64
          export PATH=$PATH:/opt/devkitpro/tools/bin
          make -j$(nproc)

      - name: Upload NRO
        uses: actions/upload-artifact@v4
        with:
          name: switch-nro
          path: "*.nro"
