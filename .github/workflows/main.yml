name: Build Switch project

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build on Ubuntu x86_64
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up devkitPro toolchain
        uses: devkitpro/setup-devkitpro@master
        with:
          toolchains: devkitA64
          packages: switch-tools switch-cmake

      - name: Print toolchain version
        run: |
          aarch64-none-elf-gcc --version
          cmake --version

      - name: Configure project
        run: |
          cmake -S . -B build \
            -DCMAKE_TOOLCHAIN_FILE="${DEVKITPRO}/cmake/Switch.cmake" \
            -DCMAKE_BUILD_TYPE=Release
        env:
          DEVKITPRO: /opt/devkitpro

      - name: Build project
        run: |
          cmake --build build --config Release --verbose
