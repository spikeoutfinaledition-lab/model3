name: Build Switch NRO

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Fix Git permissions
        run: git config --global --add safe.directory /__w/${{ github.repository }}/${{ github.repository }}

      - name: Install dependencies
        run: |
          dkp-pacman -Syu --noconfirm
          dkp-pacman -S --noconfirm --needed switch-dev switch-mesa switch-zlib switch-bzip2 switch-freetype switch-libpng switch-libjpeg-turbo

      - name: Debug environment
        run: |
          echo "Checking for stdio.h..."
          find /opt/devkitpro -name "stdio.h" 2>/dev/null
          echo "Checking for zlib.h..."
          find /opt/devkitpro -name "zlib.h" 2>/dev/null
          echo "Listing devkitA64 directory..."
          ls -R /opt/devkitpro/devkitA64/

      - name: Build with Make
        run: make
