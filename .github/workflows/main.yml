name: Build Switch NRO

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Fix Git permissions
        run: git config --global --add safe.directory /github/workspace

      - name: Install devkitPro keyring
        run: |
          sudo pacman-key --init
          sudo pacman-key --recv-keys F7FD5492264BB9D0 --keyserver keyserver.ubuntu.com
          sudo pacman-key --lsign F7FD5492264BB9D0
          sudo pacman -U --noconfirm https://pkg.devkitpro.org/devkitpro-keyring.pkg.tar.zst
          sudo pacman-key --populate devkitpro

      - name: Add devkitPro repositories
        run: |
          echo "[dkp-libs]" | sudo tee -a /etc/pacman.conf
          echo "Server = https://pkg.devkitpro.org/packages" | sudo tee -a /etc/pacman.conf
          echo "[dkp-linux]" | sudo tee -a /etc/pacman.conf
          echo "Server = https://pkg.devkitpro.org/packages/linux/\$arch/" | sudo tee -a /etc/pacman.conf

      - name: Install dependencies
        run: |
          sudo pacman -Syyu --noconfirm
          sudo pacman -S --noconfirm --needed switch-dev switch-mesa switch-zlib switch-bzip2 switch-freetype switch-libpng switch-libjpeg-turbo

      - name: Debug environment
        run: |
          echo "Checking for stdio.h..."
          find /opt/devkitpro -name "stdio.h" 2>/dev/null
          echo "Checking for zlib.h..."
          find /opt/devkitpro -name "zlib.h" 2>/dev/null
          echo "Listing devkitA64 directory..."
          ls -R /opt/devkitpro/devkitA64/

      - name: Build with Make
        run: make
