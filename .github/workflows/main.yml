name: Build Switch NRO

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: devkitpro/devkita64:latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Nuke all warnings
        run: |
          find . \( -name "Makefile*" -o -name "*.mk" -o -name "*.sh" -o -name "*.py" \) -type f \
            -exec sed -i \
            's/-Werror//g; s/-Wswitch//g; s/-Wswitch-enum//g; s/-Wpedantic//g; s/-Wextra//g' {} \;
          echo "Done patching"

      - name: Build Switch NRO
        run: |
          chmod +x build_switch.sh
          export CFLAGS="-w -Wno-error"
          export CXXFLAGS="-w -Wno-error"
          ./build_switch.sh

      - name: Upload NRO
        uses: actions/upload-artifact@v4
        with:
          name: switch-nro
          path: "*.nro"
