name: Build Switch NRO

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install DevKitPro toolchain
        run: |
          # 更新 apt 并安装依赖
          sudo apt-get update
          sudo apt-get install -y wget
          
          # 直接下载 .deb 包（绕过有问题的 wget 安装脚本）
          wget -q https://github.com/devkitPro/pacman/releases/download/v1.0.2/devkitpro-pacman.deb
          sudo dpkg -i devkitpro-pacman.deb
          
          # 验证 dkp-pacman 已安装
          which dkp-pacman
          ls /opt/devkitpro/pacman/bin/
          
          # 安装 Switch 开发套件（包含 devkitA64 + libnx + 所有依赖）
          sudo dkp-pacman -Syu --noconfirm switch-dev

      - name: Build with Make
        run: |
          export DEVKITPRO=/opt/devkitpro
          export DEVKITA64=/opt/devkitpro/devkitA64
          export PATH=$PATH:/opt/devkitpro/tools/bin
          make -j$(nproc)

      - name: Upload NRO
        uses: actions/upload-artifact@v4
        with:
          name: switch-nro
          path: "*.nro"
