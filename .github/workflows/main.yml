name: Build Switch NRO

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Switch dependencies
        run: |
          dkp-pacman -Syu --noconfirm switch-zlib switch-bzip2 switch-pkg-config switch-glad switch-mesa

      - name: Build
        run: |
          export DEVKITPRO=/opt/devkitpro
          export DEVKITA64=$DEVKITPRO/devkitA64
          export PORTLIBS=$DEVKITPRO/portlibs/switch
          
          # 强制覆盖 CFLAGS 和 LDFLAGS，加入 GL/OpenGL 路径
          export CFLAGS="-Wno-error -Wno-discarded-qualifiers -Wno-unused-variable -I$PORTLIBS/include -I$PORTLIBS/include/GL"
          export LDFLAGS="-L$PORTLIBS/lib -lz -lglad"
          
          # 使用 devkitPro 专属的 pkg-config
          export PKG_CONFIG=$PORTLIBS/bin/aarch64-none-elf-pkg-config
          
          make -j$(nproc)
